<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="1100" height="370" role="img">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#12141B"/>
      <stop offset="100%" stop-color="#0C0E13"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B85C"/>
      <stop offset="100%" stop-color="#E8B85C"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B85C" stop-opacity="0"/>
      <stop offset="18%" stop-color="#E8B85C" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#E8B85C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8B85C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E3340" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2E3340" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2E3340" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="6"
                    flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16"
                    flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="halo-sm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#736C60"/>
    </marker>
    <marker id="arw-a" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#E8B85C"/>
    </marker>
    <marker id="arw-no" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#F0716A"/>
    </marker>
    <marker id="arw-ok" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#3FB950"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1100" height="370" rx="18" fill="url(#panel)"/><rect x="0.5" y="0.5" width="1099" height="369" rx="18" fill="none" stroke="#2E3340" stroke-width="1"/><text x="550.0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#736C60" text-anchor="middle" letter-spacing="1.6">THE LEARNING LOOP</text><rect x="38.0" y="96" width="192" height="116" rx="14" fill="#1B1E27" stroke="#2E3340" stroke-width="1.4" filter="url(#soft)"/><text x="56.0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E8B85C" letter-spacing="1.4">01</text><text x="56.0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F2EFE9">Gap analysis</text><text x="56.0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A29B8E">What the vault covers,</text><text x="56.0" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A29B8E">and what you have kept</text><path d="M232.0 154.0 L242.0 154.0" fill="none" stroke="#736C60" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="246.0" y="96" width="192" height="116" rx="14" fill="#1B1E27" stroke="#2E3340" stroke-width="1.4" filter="url(#soft)"/><text x="264.0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E8B85C" letter-spacing="1.4">02</text><text x="264.0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F2EFE9">Study document</text><text x="264.0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A29B8E">Self-contained, written</text><text x="264.0" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A29B8E">for listening if you like</text><path d="M440.0 154.0 L450.0 154.0" fill="none" stroke="#736C60" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="454.0" y="96" width="192" height="116" rx="14" fill="#1B1E27" stroke="#E8B85C" stroke-width="1.8" filter="url(#soft)"/><text x="472.0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E8B85C" letter-spacing="1.4">03</text><text x="472.0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F2EFE9">Vault-blind tutor</text><text x="472.0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A29B8E">Works only from that page,</text><text x="472.0" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A29B8E">so it cannot leak answers</text><path d="M648.0 154.0 L658.0 154.0" fill="none" stroke="#736C60" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="662.0" y="96" width="192" height="116" rx="14" fill="#1B1E27" stroke="#2E3340" stroke-width="1.4" filter="url(#soft)"/><text x="680.0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E8B85C" letter-spacing="1.4">04</text><text x="680.0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F2EFE9">Honest grade</text><text x="680.0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A29B8E">Blunt by instruction.</text><text x="680.0" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A29B8E">Flattery corrupts the plan</text><path d="M856.0 154.0 L866.0 154.0" fill="none" stroke="#736C60" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="870.0" y="96" width="192" height="116" rx="14" fill="#1B1E27" stroke="#2E3340" stroke-width="1.4" filter="url(#soft)"/><text x="888.0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E8B85C" letter-spacing="1.4">05</text><text x="888.0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F2EFE9">Back through the gate</text><text x="888.0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A29B8E">Your claims enter as</text><text x="888.0" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A29B8E">hypothesis until checked</text><path d="M966.0 216 L966.0 264 Q966.0 274 956.0 274 L144.0 274 Q134.0 274 134.0 264 L134.0 220" fill="none" stroke="#E8B85C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-a)"/><text x="550.0" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A29B8E" text-anchor="middle">The next curriculum uses what you demonstrably kept, not what you finished.</text>
</svg>
