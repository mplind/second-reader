<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 540" width="1240" height="540" role="img">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#12141B"/>
      <stop offset="100%" stop-color="#0C0E13"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B85C"/>
      <stop offset="100%" stop-color="#E8B85C"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B85C" stop-opacity="0"/>
      <stop offset="18%" stop-color="#E8B85C" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#E8B85C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8B85C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E3340" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2E3340" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2E3340" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="6"
                    flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16"
                    flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="halo-sm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#736C60"/>
    </marker>
    <marker id="arw-a" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#E8B85C"/>
    </marker>
    <marker id="arw-no" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#F0716A"/>
    </marker>
    <marker id="arw-ok" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#3FB950"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1240" height="540" rx="18" fill="url(#panel)"/><rect x="0.5" y="0.5" width="1239" height="539" rx="18" fill="none" stroke="#2E3340" stroke-width="1"/><text x="620.0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#736C60" text-anchor="middle" letter-spacing="1.6">HOW THE VAULT TEACHES YOU</text><rect x="60" y="92" width="320" height="176" rx="14" fill="#1B1E27" stroke="#2E3340" stroke-width="1.4" filter="url(#soft)"/><text x="84" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E8B85C" letter-spacing="1.4">01</text><text x="84" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2EFE9">It draws up a curriculum</text><text x="84" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">Built from what your vault holds and</text><text x="84" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">what you have not retained yet.</text><rect x="84" y="152" width="13" height="11" rx="2" fill="#2A2416" stroke="#E8B85C" stroke-width="1.1"/><line x1="104" y1="158" x2="254" y2="158" stroke="#E8B85C" stroke-width="3" stroke-linecap="round" opacity="0.9"/><rect x="84" y="167" width="13" height="11" rx="2" fill="#171A22" stroke="#282C37" stroke-width="1.1"/><line x1="104" y1="173" x2="224" y2="173" stroke="#736C60" stroke-width="3" stroke-linecap="round" opacity="0.4"/><rect x="84" y="182" width="13" height="11" rx="2" fill="#171A22" stroke="#282C37" stroke-width="1.1"/><line x1="104" y1="188" x2="238" y2="188" stroke="#736C60" stroke-width="3" stroke-linecap="round" opacity="0.4"/><rect x="84" y="197" width="13" height="11" rx="2" fill="#171A22" stroke="#282C37" stroke-width="1.1"/><line x1="104" y1="203" x2="204" y2="203" stroke="#736C60" stroke-width="3" stroke-linecap="round" opacity="0.4"/><rect x="460" y="92" width="320" height="176" rx="14" fill="#1B1E27" stroke="#E8B85C" stroke-width="1.8" filter="url(#soft)"/><text x="484" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E8B85C" letter-spacing="1.4">02</text><text x="484" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2EFE9">It builds one tutor pack</text><text x="484" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">Everything the tutor needs, in a single</text><text x="484" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">file, for the next topic only.</text><rect x="484" y="148" width="62" height="66" rx="4" fill="#171A22" stroke="#E8B85C" stroke-width="1.5"/><path d="M530 148 L546 164 L530 164 z" fill="#1B1E27" stroke="#E8B85C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="492" y1="172" x2="538" y2="172" stroke="#736C60" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><line x1="492" y1="182" x2="538" y2="182" stroke="#736C60" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><line x1="492" y1="192" x2="538" y2="192" stroke="#736C60" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><line x1="492" y1="202" x2="538" y2="202" stroke="#736C60" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><path d="M559.24 155.12 L561.4 157.4 L565.0 152.72" fill="none" stroke="#3FB950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="576" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#A29B8E">how to teach</text><path d="M559.24 171.12 L561.4 173.4 L565.0 168.72" fill="none" stroke="#3FB950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="576" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#A29B8E">who you are</text><path d="M559.24 187.12 L561.4 189.4 L565.0 184.72" fill="none" stroke="#3FB950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="576" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#A29B8E">the material</text><path d="M559.24 203.12 L561.4 205.4 L565.0 200.72" fill="none" stroke="#3FB950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="576" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#A29B8E">the questions</text><rect x="860" y="92" width="320" height="176" rx="14" fill="#1B1E27" stroke="#2E3340" stroke-width="1.4" filter="url(#soft)"/><text x="884" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E8B85C" letter-spacing="1.4">03</text><text x="884" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2EFE9">You hand it to any AI</text><text x="884" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">Voice or text, whichever you already use.</text><text x="884" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">It gets the pack and nothing else.</text><rect x="884" y="148" width="130" height="62" rx="10" fill="#171A22" stroke="#282C37" stroke-width="1.3"/><rect x="904" y="164" width="12" height="20" rx="6" fill="#E8B85C"/><path d="M899 180 A11 11 0 0 0 921 180" fill="none" stroke="#E8B85C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="910" y1="191" x2="910" y2="196" stroke="#E8B85C" stroke-width="2" stroke-linecap="round"/><text x="934" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">voice</text><rect x="1026" y="148" width="130" height="62" rx="10" fill="#171A22" stroke="#282C37" stroke-width="1.3"/><rect x="1046" y="164" width="34" height="26" rx="6" fill="#1B1E27" stroke="#E8B85C" stroke-width="1.6"/><path d="M1054 190 L1056 198 L1064 190 z" fill="#E8B85C"/><line x1="1052" y1="172" x2="1074" y2="172" stroke="#E8B85C" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><line x1="1052" y1="180" x2="1074" y2="180" stroke="#E8B85C" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><text x="1090" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">text</text><rect x="860" y="316" width="320" height="176" rx="14" fill="#1B1E27" stroke="#2E3340" stroke-width="1.4" filter="url(#soft)"/><text x="884" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E8B85C" letter-spacing="1.4">04</text><text x="884" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2EFE9">It teaches, then tests you</text><text x="884" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">New material is taught before you are</text><text x="884" y="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">asked about it. Grading is blunt.</text><rect x="884" y="372" width="150" height="24" rx="8" fill="#171A22" stroke="#282C37" stroke-width="1.2"/><text x="896" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#A29B8E">teaches the idea</text><rect x="934" y="404" width="150" height="24" rx="8" fill="#2A2416" stroke="#E8B85C" stroke-width="1.2"/><text x="946" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#A29B8E">you play it back</text><circle cx="1118" cy="400" r="20" fill="#1B1E27" stroke="#3FB950" stroke-width="1.8"/><path d="M1112.02 400.26 L1116.7 405.2 L1124.5 395.06" fill="none" stroke="#3FB950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="316" width="320" height="176" rx="14" fill="#1B1E27" stroke="#E8B85C" stroke-width="1.8" filter="url(#soft)"/><text x="484" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E8B85C" letter-spacing="1.4">05</text><text x="484" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2EFE9">The session goes back in</text><text x="484" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">The tutor writes up how you did. It</text><text x="484" y="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A29B8E">re-enters through the same gate.</text><rect x="484" y="374" width="58" height="62" rx="5" fill="#1B1E27" stroke="#E8B85C" stroke-width="1.5"/><line x1="492" y1="388" x2="532" y2="388" stroke="#736C60" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><line x1="492" y1="398" x2="532" y2="398" stroke="#736C60" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><line x1="492" y1="408" x2="532" y2="408" stroke="#736C60" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><line x1="492" y1="418" x2="532" y2="418" stroke="#736C60" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><line x1="492" y1="428" x2="516" y2="428" stroke="#736C60" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/><path d="M552 405 L586 405" fill="none" stroke="#E8B85C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-a)"/><line x1="620" y1="391" x2="688" y2="387" stroke="#E8B85C" stroke-width="1.1" stroke-linecap="round" opacity="0.32"/><line x1="620" y1="391" x2="638" y2="433" stroke="#E8B85C" stroke-width="1.1" stroke-linecap="round" opacity="0.32"/><line x1="620" y1="391" x2="706" y2="429" stroke="#E8B85C" stroke-width="1.1" stroke-linecap="round" opacity="0.32"/><line x1="688" y1="387" x2="638" y2="433" stroke="#E8B85C" stroke-width="1.1" stroke-linecap="round" opacity="0.32"/><line x1="688" y1="387" x2="706" y2="429" stroke="#E8B85C" stroke-width="1.1" stroke-linecap="round" opacity="0.32"/><line x1="638" y1="433" x2="706" y2="429" stroke="#E8B85C" stroke-width="1.1" stroke-linecap="round" opacity="0.32"/><rect x="600" y="378" width="40" height="26" rx="5" fill="#1B1E27" stroke="#2E3340" stroke-width="1.2" filter="url(#soft)"/><line x1="607" y1=