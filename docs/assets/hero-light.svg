172" width="44" height="58" rx="5" fill="#FFFFFF" stroke="#9A6B12" stroke-width="1.2" filter="url(#soft)"/><line x1="571" y1="183" x2="597" y2="183" stroke="#98907F" stroke-width="2" stroke-linecap="round" opacity="0.75"/><line x1="571" y1="190.5" x2="597" y2="190.5" stroke="#98907F" stroke-width="2" stroke-linecap="round" opacity="0.75"/><line x1="571" y1="198.0" x2="586.08" y2="198.0" stroke="#98907F" stroke-width="2" stroke-linecap="round" opacity="0.75"/><circle cx="606" cy="176" r="11" fill="#FFFFFF" stroke="#1E7A3C" stroke-width="1.6"/><path d="M601.86 176.18 L605.1 179.6 L610.5 172.58" fill="none" stroke="#1E7A3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="482" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1714" text-anchor="middle">The gate</text><text x="482" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6F675A" text-anchor="middle">A second pass re-reads the source cold.</text><text x="482" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6F675A" text-anchor="middle">Nothing passes until a round finds nothing.</text><path d="M634 200 L700 200" fill="none" stroke="#98907F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 7" marker-end="url(#arw)"/><line x1="765" y1="134" x2="859" y2="112" stroke="#9A6B12" stroke-width="1.3" stroke-linecap="round" opacity="0.38"/><line x1="859" y1="112" x2="953" y2="148" stroke="#9A6B12" stroke-width="1.3" stroke-linecap="round" opacity="0.38"/><line x1="765" y1="134" x2="785" y2="204" stroke="#9A6B12" stroke-width="1.3" stroke-linecap="round" opacity="0.38"/><line x1="859" y1="112" x2="889" y2="188" stroke="#9A6B12" stroke-width="1.3" stroke-linecap