<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FDFCFA"/>
      <stop offset="100%" stop-color="#F4F1EC"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A548"/>
      <stop offset="100%" stop-color="#9A6B12"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A548" stop-opacity="0"/>
      <stop offset="18%" stop-color="#D8A548" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#D8A548" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D8A548" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D8D1C4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D8D1C4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D8D1C4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="6"
                    flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16"
                    flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="halo-sm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#98907F"/>
    </marker>
    <marker id="arw-a" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#9A6B12"/>
    </marker>
    <marker id="arw-no" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#AE3A33"/>
    </marker>
    <marker id="arw-ok" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#1E7A3C"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1100" height="330" rx="18" fill="url(#panel)"/><rect x="0.5" y="0.5" width="1099" height="329" rx="18" fill="none" stroke="#E2DCD1" stroke-width="1"/><text x="550.0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#98907F" text-anchor="middle" letter-spacing="1.6">THREE WAYS PEOPLE USE IT</text><rect x="34.0" y="68" width="329.3333333333333" height="214" rx="14" fill="#FFFFFF" stroke="#E2DCD1" stroke-width="1.4" filter="url(#soft)"/><text x="52.0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9A6B12" letter-spacing="1.2">01</text><rect x="168.66666666666666" y="116" width="9" height="40" rx="2" fill="#F0EDE7" stroke="#DCD5C9" stroke-width="1.4"/><rect x="176.66666666666666" y="118" width="9" height="36" rx="2" fill="#F0EDE7" stroke="#DCD5C9" stroke-width="1.4"/><rect x="184.66666666666666" y="120" width="9" height="32" rx="2" fill="#F0EDE7" stroke="#DCD5C9" stroke-width="1.4"/><path d="M196.66666666666666 136 L210.66666666666666 136" fill="none" stroke="#98907F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="212.66666666666666" y="114" width="30" height="44" rx="4" fill="#FFFFFF" stroke="#9A6B12" stroke-width="2" filter="url(#soft)"/><line x1="218.66666666666666" y1="124" x2="236.66666666666666" y2="124" stroke="#9A6B12" stroke-width="2" stroke-linecap="round" opacity="0.6"/><line x1="218.66666666666666" y1="132" x2="236.66666666666666" y2="132" stroke="#9A6B12" stroke-width="2" stroke-linecap="round" opacity="0.6"/><line x1="218.66666666666666" y1="140" x2="229.66666666666666" y2="140" stroke="#9A6B12" stroke-width="2" stroke-linecap="round" opacity="0.6"/><text x="198.66666666666666" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1714" text-anchor="middle">Read less</text><text x="198.66666666666666" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6F675A" text-anchor="middle">Books, PDFs and transcripts go in.</text><text x="198.66666666666666" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6F675A" text-anchor="middle">A cited wiki comes out.</text><text x="198.66666666666666" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6F675A" text-anchor="middle">You read the wiki, not the shelf.</text><rect x="385.3333333333333" y="68" width="329.3333333333333" height="214" rx="14" fill="#FFFFFF" stroke="#E2DCD1" stroke-width="1.4" filter="url(#soft)"/><text x="403.3333333333333" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9A6B12" letter-spacing="1.2">02</text><line x1="520.0" y1="131.0" x2="520.0" y2="141.0" stroke="#98907F" stroke-width="3.4" stroke-linecap="round" opacity="0.55"/><line x1="528.0" y1="126.0" x2="528.0" y2="146.0" stroke="#98907F" stroke-width="3.4" stroke-linecap="round" opacity="0.55"/><line x1="536.0" y1="120.0" x2="536.0" y2="152.0" stroke="#98907F" stroke-width="3.4" stroke-linecap="round" opacity="0.55"/><line x1="544.0" y1="125.0" x2="544.0" y2="147.0" stroke="#98907F" stroke-width="3.4" stroke-linecap="round" opacity="0.55"/><line x1="552.0" y1="130.0" x2="552.0" y2="142.0" stroke="#98907F" stroke-width="3.4" stroke-linecap="round" opacity="0.55"/><path d="M562.0 136 L572.0 136" fill="none" stroke="#98907F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><circle cx="588.0" cy="136" r="17" fill="none" stroke="#9A6B12" stroke-width="2"/><path d="M580.0 137 L586.0 143 L597.0 128" fill="none" stroke="#9A6B12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="550.0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1714" text-anchor="middle">Learn it</text><text x="550.0" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6F675A" text-anchor="middle">The vault finds your gaps, sets the</text><text x="550.0" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6F675A" text-anchor="middle">curriculum, tutors you closed-book</text><text x="550.0" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6F675A" text-anchor="middle">and grades you without flattery.</text><rect x="736.6666666666666" y="68" width="329.3333333333333" height="214" rx="14" fill="#FFFFFF" stroke="#E2DCD1" stroke-width="1.4" filter="url(#soft)"/><text x="754.6666666666666" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9A6B12" letter-spacing="1.2">03</text><rect x="867.3333333333333" y="116" width="40" height="28" rx="7" fill="#F0EDE7" stroke="#DCD5C9" stroke-width="1.6"/><path d="M875.3333333333333 144 L877.3333333333333 153 L885.3333333333333 144 z" fill="#F0EDE7"/><text x="887.3333333333333" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#6F675A" text-anchor="middle">?</text><path d="M911.3333333333333 130 L921.3333333333333 130" fill="none" stroke="#98907F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="925.3333333333333" y="114" width="32" height="44" rx="5" fill="#FFFFFF" stroke="#9A6B12" stroke-width="2" filter="url(#soft)"/><line x1="931.3333333333333" y1="124" x2="951.3333333333333" y2="124" stroke="#98907F" stroke-width="2" stroke-linecap="round" opacity="0.6"/><line x1="931.3333333333333" y1="132" x2="951.3333333333333" y2="132" stroke="#98907F" stroke-width="2" stroke-linecap="round" opacity="0.6"/><line x1="931.3333333333333" y1="140" x2="943.3333333333333" y2="140" stroke="#98907F" stroke-width="2" stroke-linecap="round" opacity="0.6"/><path d="M931.3333333333333 150 L935.3333333333333 154 L943.3333333333333 145" fill="none" stroke="#9A6B12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="901.3333333333333" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1714" text-anchor="middle">Ask it</text><text x="901.3333333333333" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6F675A" text-anchor="middle">Ask it like an advisor who did the</text><text x="901.3333333333333" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6F675A" text-anchor="middle">reading. Answers arrive with</text><text x="901.3333333333333" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6F675A" text-anchor="middle">citations, checked before you act.</text>
</svg>
